name: Agent tests

on:
  push:
    paths:
      - 'agent/**'
  pull_request:
    paths:
      - 'agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest; fi
      - name: Run agent tests
        run: |
          python -m pytest -q agent/tests
