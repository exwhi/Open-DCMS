apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-dcms-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-dcms-backend
  template:
    metadata:
      labels:
        app: open-dcms-backend
    spec:
      containers:
        - name: backend
          image: open-dcms-backend:local
          ports:
            - containerPort: 8000
          env:
            - name: OPEN_DCMS_API_KEY
              value: "dev-secret"

---
apiVersion: v1
kind: Service
metadata:
  name: open-dcms-backend
spec:
  selector:
    app: open-dcms-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
